name: Flutter Debug APK

# Builds a debug APK in the cloud on every push to main (or manually), and
# uploads it as a downloadable artifact — so you can grab a fresh APK from the
# GitHub "Actions" tab without building on your own PC.
on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-debug-apk.yml'
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: velora-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
