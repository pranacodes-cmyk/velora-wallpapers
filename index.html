    <script>
      // Set perf-throttling classes BEFORE any CSS/JS renders. Doing this in
      // main.tsx means Android devices burn one full paint pass with
      // backdrop-filter / mix-blend-mode / infinite animations enabled — that
      // paint pass is exactly what the nSyncAndDrawFrame ANR traces show.
      (function () {
        try {
          var de = document.documentElement;
          var n = navigator || {};
          var ua = n.userAgent || "";
          if (/Android/i.test(ua)) de.classList.add("android-device");
          var mem = typeof n.deviceMemory === "number" ? n.deviceMemory : null;
          var cores = typeof n.hardwareConcurrency === "number" ? n.hardwareConcurrency : null;
          if ((mem !== null && mem <= 4) || (cores !== null && cores <= 6) || /Android/i.test(ua)) {
            de.classList.add("low-end-device");
          }
          de.classList.add("startup-safe-mode");
          setTimeout(function () { de.classList.remove("startup-safe-mode"); }, 10000);
        } catch (e) {}
      })();
    </script>
