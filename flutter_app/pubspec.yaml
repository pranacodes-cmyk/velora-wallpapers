name: prayly
description: "Prayly: Bible Prayer & Verse — native Flutter app (1:1 port of the web app)."
publish_to: "none"
version: 1.0.23+23

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State / architecture
  flutter_riverpod: ^2.5.1

  # Backend (same Lovable Cloud project as the web app)
  supabase_flutter: ^2.5.6

  # Purchases — same RevenueCat project, entitlement and products
  # Play Billing 8 is mandatory for new Play uploads.
  purchases_flutter: ^10.13.1


  # Storage / caching
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1

  # Media
  just_audio: ^0.9.38
  audio_session: ^0.1.19
  video_player: ^2.8.7

  # Device
  sensors_plus: ^5.0.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.0
  in_app_review: ^2.0.9
  path_provider: ^2.1.3

  # Networking (edge functions + audio manifest probing)
  http: ^1.2.2

  # Ads (same AdMob units as the web/Capacitor build)
  google_mobile_ads: ^5.1.0

  # Meta (Facebook) App Events — same app id/client token as the Capacitor build
  facebook_app_events: ^0.19.2

  # Analytics — same PostHog project and event names
  posthog_flutter: ^5.44.2

  # UI helpers
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/images/social/
    - assets/images/devotional/
    # Explicit covers exclude duplicate unprefixed images and unused reminders.
    - assets/images/journeys/journey-anxiety-peace.webp
    - assets/images/journeys/journey-strength-hard-times.webp
    - assets/images/journeys/journey-healing.webp
    - assets/images/journeys/journey-building-faith.webp
    - assets/images/journeys/journey-gratitude-joy.webp
    - assets/images/journeys/journey-loneliness.webp
    - assets/images/journeys/journey-forgiveness-letting-go.webp
    - assets/images/journeys/journey-purpose-calling.webp
    - assets/images/journeys/journey-marriage-love.webp
    - assets/images/journeys/journey-overcoming-temptation.webp
    - assets/images/journeys/journey-grief-loss.jpg
    - assets/images/journeys/journey-money-provision.jpg
    - assets/images/journeys/journey-rest-sleep.jpg
    - assets/images/prayscreen/
    - assets/data/
    - assets/bible/en/
    - assets/bible/es/
    - assets/bible/pt/
    - assets/bible/fil/
    - assets/bible/hi/
    - assets/bible/id/
    - assets/bible/fr/
    - assets/bible/de/
  fonts:
    # Same families the web build uses: Inter for UI, Cormorant Garamond for
    # scripture. Bundled (not downloaded) so first paint matches exactly.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
